name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q transcriber
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test
        env:
          TRANSCRIBER_TOKEN: ci-only-not-a-production-token-0123456789
        run: |
          docker compose up --build -d
          trap 'docker compose down -v' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/readyz)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/v1/capabilities)" = 401
          curl -fsS -H "Authorization: Bearer $TRANSCRIBER_TOKEN" http://127.0.0.1:8765/v1/capabilities | python -c 'import json,sys; assert json.load(sys.stdin)["transcription"] is False'
      - name: Verify CPU model with synthetic speech
        timeout-minutes: 15
        env:
          TRANSCRIBER_TOKEN: ci-only-not-a-production-token-0123456789
        run: |
          trap 'docker compose down -v' EXIT
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng
          espeak-ng -s 140 -w "$RUNNER_TEMP/narration.wav" "Good morning. The sun is shining. This is a test of audiobook transcription."
          chmod 644 "$RUNNER_TEMP/narration.wav"
          docker compose run --rm --no-deps transcriber prepare-model
          docker compose run --rm --no-deps --entrypoint python -e HF_HUB_OFFLINE=1 -e PYTHONPATH=/app -v "$RUNNER_TEMP/narration.wav:/narration.wav:ro" -v "$PWD/tests/verify_cpu.py:/verify_cpu.py:ro" transcriber /verify_cpu.py /narration.wav
