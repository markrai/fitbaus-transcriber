name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q transcriber
      - run: bash -n deploy.sh && bash -n scripts/verify-release-image.sh
      - run: test -x deploy.sh
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test
        env:
          TRANSCRIBER_TOKEN: ci-only-not-a-production-token-0123456789
        run: |
          chmod -R go-rwx transcriber
          trap 'docker compose down -v' EXIT
          ./deploy.sh
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/healthz
          docker compose exec -T transcriber python -m transcriber pair | grep -Ex '[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/readyz)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/v1/capabilities)" = 401
          curl -fsS -H "Authorization: Bearer $TRANSCRIBER_TOKEN" http://127.0.0.1:8765/v1/capabilities | python -c 'import json,sys; d=json.load(sys.stdin); assert d["transcription"] is False; assert d["model_present"] is True'
      - name: Verify release image with synthetic speech
        timeout-minutes: 15
        env:
          TRANSCRIBER_TOKEN: ci-only-not-a-production-token-0123456789
          TRANSCRIBER_IMAGE: fitbaus-transcriber:ci-release
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng
          docker build --platform linux/amd64 --tag "$TRANSCRIBER_IMAGE" .
          bash scripts/verify-release-image.sh
